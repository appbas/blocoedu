<div class="login-card">

  <p>Insira suas credenciais para acessar o painel.</p>

  <div class="field">
    <label>E-mail ou Usuário</label>
    <input type="text" placeholder="exemplo@escola.com"  />
  </div>

  <div class="field">
    <label>Senha</label>
    <input type="password" placeholder="••••••••" />

  <div class="footer-links">
    <a routerLink="recover">Esqueceu a senha?</a>
    <span style="color: var(--text-muted)">v1.0.4</span>
  </div>
</div>
