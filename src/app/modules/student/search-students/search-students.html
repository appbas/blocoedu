<h2>Alunos</h2>

<section class="card filter-bar radius-md border-1 border-solid border-1 shadow-sm">
    <div class="field">
        <label for="search">Pesquisar</label>
        <input type="text" id="search" placeholder="Nome, matrícula ou CPF..." class="filter-input">
    </div>

    <div class="field">
        <label for="turma">Turma</label>
        <select id="turma" class="filter-input">
            <option value="">Todas as turmas</option>
            <option value="1a">1º Ano A</option>
            <option value="1b">1º Ano B</option>
            <option value="2a">2º Ano A</option>
        </select>
    </div>

    <div class="field">
        <label for="status">Situação</label>
        <select id="status" class="filter-input">
            <option value="">Todos os status</option>
            <option value="ativo">Ativos</option>
            <option value="inativo">Inativos</option>
            <option value="pendente">Pendentes</option>
        </select>
    </div>

    <div class="filter-actions">
        <button class="btn-primary radius-md">Filtrar</button>
        <button class="btn-soft radius-md">Limpar</button>
    </div>
</section>
